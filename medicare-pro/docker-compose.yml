version: '3.8'

services:
  # ─── PHP-FPM Application Container ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicare-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_HOST=soketi
      - BROADCAST_PORT=6001

  # ─── Nginx Web Server ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: medicare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
    networks:
      - medicare-network

  # ─── MySQL 8.0 Database ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: medicare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-medicare_pro}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-medicare}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - medicare-network

  # ─── Redis 7 Cache & Queue Backend ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medicare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - medicare-network

  # ─── phpMyAdmin (Optional) ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: medicare-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-medicare}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 100M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - medicare-network

  # ─── Soketi WebSocket Server (Laravel Echo) ────────────────────────
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: medicare-soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
      - "9601:9601"
    volumes:
      - ./docker/soketi/config.json:/etc/soketi/config.json
    environment:
      SOKETI_DEBUG: ${SOKETI_DEBUG:-1}
      SOKETI_METRICS_SERVER_PORT: "9601"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medicare-network

  # ─── Laravel Queue Worker ───────────────────────────────────────────
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicare-network
    entrypoint: ["php", "/var/www/html/artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]

  # ─── Laravel Scheduler (Cron) ──────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicare-network
    entrypoint: ["sh", "-c", "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction & sleep 60; done"]

networks:
  medicare-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
